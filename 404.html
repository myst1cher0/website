<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page Not Found - MysticHero</title>
<meta name="description" content="The page you are looking for does not exist.">
<meta name="theme-color" content="#0a0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0820;
    --violet: #7a5cff;
    --aqua: #38e1d1;
    --rose: #ff7ab8;
    --gold: #ffc46b;
    --mist: #eef0ff;
    --text: rgba(238, 240, 255, 0.84);
    --display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --body: 'Figtree', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --pad: clamp(16px, 4vw, 40px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    font-size: 1.05rem;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  h1, h2 { font-family: var(--display); color: var(--mist); margin: 0; line-height: 1.05; }
  p { margin: 0; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--aqua); outline-offset: 3px; }

  /* ---------- Backdrop ---------- */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--ink); }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.75; will-change: transform; }
  .blob-1 { width: 55vmax; height: 55vmax; left: -15vmax; top: -18vmax; background: radial-gradient(circle, var(--violet), transparent 65%); }
  .blob-2 { width: 46vmax; height: 46vmax; right: -14vmax; top: 18vh; background: radial-gradient(circle, var(--aqua), transparent 65%); opacity: 0.5; }

  /* ---------- Liquid glass container ---------- */
  .glass {
    --r: 28px;
    position: relative;
    border-radius: var(--r);
    background: linear-gradient(140deg, rgba(255,255,255,0.17), rgba(255,255,255,0.05));
    -webkit-backdrop-filter: blur(22px) saturate(185%);
    backdrop-filter: blur(22px) saturate(185%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 1px 0 0 rgba(255,255,255,0.18),
      inset 0 -1px 0 rgba(255,255,255,0.08),
      0 24px 48px -24px rgba(4, 2, 30, 0.7);
  }
  .glass::before {
    content: "";
    position: absolute; inset: 0; padding: 1px;
    border-radius: inherit;
    background: linear-gradient(140deg, rgba(255,255,255,0.75), rgba(255,255,255,0.06) 32%, rgba(255,255,255,0.06) 68%, rgba(255,255,255,0.5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
  }
  .glass::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(255,255,255,0.26), transparent 62%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .glass:hover::after { opacity: 1; }

  /* ---------- Error Box Content ---------- */
  .error-card {
    padding: clamp(32px, 5vw, 48px);
    text-align: center;
    max-width: 480px;
    width: calc(100% - 2 * var(--pad));
    margin: var(--pad);
  }
  .error-code {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(4rem, 12vw, 6rem);
    letter-spacing: -0.045em;
    background: linear-gradient(180deg, #ffffff 30%, #c9c0ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .error-card h1 {
    font-size: 1.5rem;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  .error-card p {
    color: var(--mist);
    margin-bottom: 28px;
    font-size: 1.05rem;
  }
  .home-btn {
    --r: 999px;
    display: inline-block;
    padding: 14px 28px;
    font-weight: 600;
    color: var(--mist);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    transition: background 0.2s ease;
  }
  .home-btn:hover {
    background: rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
</div>

<main class="error-card glass">
  <div class="error-code">404</div>
  <h1>Page not found</h1>
  <p>Oops! The page you are looking for doesn't exist or has been moved.</p>
  <a class="home-btn" href="/">Back to Home</a>
</main>

<script>
  document.addEventListener('pointermove', function (e) {
    var g = e.target.closest && e.target.closest('.glass');
    if (!g) return;
    var r = g.getBoundingClientRect();
    g.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    g.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
</script>
</body>
</html>
